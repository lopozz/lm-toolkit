languages:
  - ita

modalities:
  - text

task_types:
  - Retrieval

excluded_tasks:
  # multimodal (text + image)
  - VDRMultilingualRetrieval
  # too long docs
  - MultiLongDocRetrieval
  # too many docs ~258k
  - WebFAQRetrieval

split_overrides:
  MKQARetrieval: [train]

# Not in MTEB's task registry: added by the script on top of get_tasks().
# Names are keys of lm_toolkit.tasks.retrieval.CUSTOM_TASKS.
custom_tasks:
  - CulturaViva-Retrieval
  - MMarco-IT-Retrieval
  - NorQuADRetrieval
  - JaQuADRetrieval
  - SberQuADRetrieval
  - GermanDPRRetrieval
